<!doctype html>
<html lang="zh-CN" data-theme="biophilic">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Outlook 邮件工作台</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=20260601-3" />
    <link rel="stylesheet" href="styles.css?v=20260603-1" />
  </head>
  <body>
    <main class="mail-app">
      <aside class="account-pane">
        <header class="pane-head">
          <div>
            <h1>Outlook Lite<br />令牌取件</h1>
          </div>
          <button id="add-account-button" class="add-account-trigger" type="button" title="添加邮箱">
            <span>+</span>
            <strong>添加邮箱</strong>
          </button>
        </header>

        <div class="search-box account-search-box">
          <input id="account-search" type="search" placeholder="搜索邮箱" autocomplete="off" />
          <button id="account-search-clear" class="account-search-clear" type="button" aria-label="清空邮箱搜索" title="清空搜索并继续输入">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 6h18"></path>
              <path d="M8 6V4h8v2"></path>
              <path d="M19 6l-1 14H6L5 6"></path>
              <path d="M10 11v5"></path>
              <path d="M14 11v5"></path>
            </svg>
          </button>
        </div>

        <section class="account-tools">
          <div class="tool-row">
            <label for="sort-select">排序</label>
            <div class="select-wrap" data-select-wrap>
              <select id="sort-select" data-custom-select>
                <option value="createdDesc">导入时间 新-旧</option>
                <option value="createdAsc">导入时间 旧-新</option>
                <option value="emailAsc">邮箱名 A-Z</option>
                <option value="emailDesc">邮箱名 Z-A</option>
              </select>
            </div>
          </div>
          <div class="tool-row">
            <label for="top-select">每页</label>
            <div class="select-wrap compact" data-select-wrap>
              <select id="top-select" data-custom-select>
                <option value="10">10</option>
                <option value="20" disabled>20</option>
                <option value="50" disabled>50</option>
              </select>
            </div>
          </div>
        </section>

        <section id="account-list" class="account-list" aria-label="邮箱列表"></section>
      </aside>

      <section class="message-pane">
        <header class="message-head">
          <div>
            <p id="mail-summary">添加邮箱后读取邮件</p>
          </div>
          <button id="fetch-button" type="button">获取邮件</button>
        </header>

        <nav class="folder-tabs" aria-label="邮件筛选">
          <button class="folder-tab active" type="button" data-filter="all">收件箱</button>
          <button class="folder-tab" type="button" data-filter="junk">垃圾邮件</button>
          <button class="folder-tab" type="button" data-filter="unread">未读</button>
        </nav>

        <div class="message-search">
          <input id="message-search" type="search" placeholder="搜索标题、发件人、邮箱或验证码" autocomplete="off" />
        </div>

        <div id="status" class="status" aria-live="polite"></div>
        <section id="message-list" class="message-list" aria-label="邮件列表"></section>
      </section>

      <section class="detail-pane">
        <header class="detail-toolbar">
          <button id="toggle-source-button" class="toolbar-button" type="button">显示邮件源</button>
          <div id="theme-switcher" class="theme-switcher">
            <button id="theme-toggle-button" class="theme-toggle-button" type="button" aria-label="更换主题" aria-expanded="false">
              <span>主题</span>
              <strong>亲生物设计</strong>
            </button>
            <div id="theme-menu" class="theme-menu" role="menu" aria-label="主题选择"></div>
          </div>
          <label class="background-opacity-control" for="background-opacity-range" title="调整邮箱主页背景透出强度">
            <span>透明度</span>
            <input id="background-opacity-range" type="range" min="60" max="100" step="5" />
            <output id="background-opacity-value">75%</output>
          </label>
          <div class="data-actions toolbar-data-actions" aria-label="本地邮箱数据">
            <button id="import-accounts-button" class="tool-action" type="button" aria-label="导入本地邮箱令牌列表文件" data-tooltip="导入本地邮箱令牌列表文件">导入</button>
            <button id="export-accounts-button" class="tool-action" type="button" aria-label="导出当前邮箱令牌列表到文件" data-tooltip="导出当前邮箱令牌列表到文件">导出</button>
            <button id="clear-cache-button" class="tool-action" type="button" aria-label="清空已读取邮件缓存，不删除邮箱令牌" data-tooltip="清空已读取邮件缓存，不删除邮箱令牌">清缓存</button>
            <input id="import-accounts-file" type="file" accept=".txt,.json,text/plain,application/json" hidden />
          </div>
          <button id="clear-storage-button" class="storage-clear toolbar-clear" type="button">清空本地邮箱</button>
        </header>

        <article id="message-detail" class="message-detail empty">
          <div class="empty-state">
            <h2>选择一封邮件</h2>
            <p>邮件正文会显示在这里。</p>
          </div>
        </article>
      </section>
    </main>

    <div id="account-modal" class="modal" aria-hidden="true">
      <div class="modal-backdrop" data-close-modal></div>
      <form id="account-form" class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <header class="modal-head">
          <div>
            <div class="eyebrow">Outlook</div>
            <h2 id="modal-title">添加邮箱</h2>
          </div>
          <button class="modal-close" type="button" data-close-modal>×</button>
        </header>
        <div class="account-format-note">
          <label for="account-input">tip:</label>
          <p>
            读取邮件实际使用的是 <code>client_id + refresh_token</code> 换取访问令牌；<br />
            密码字段只是兼容原始账号格式的占位，不参与登录校验，可以任意填写。
          </p>
        </div>
        <textarea
          id="account-input"
          spellcheck="false"
          autocomplete="off"
          placeholder="每行一个邮箱令牌，支持下列2种格式&#10;邮箱----密码----client_id----refresh_token&#10;邮箱----密码----refresh_token----client_id"
        ></textarea>
        <div id="account-input-check" class="account-input-check" aria-live="polite">
          <span>等待输入邮箱令牌</span>
        </div>
        <footer class="modal-actions">
          <button id="clear-accounts-button" class="ghost" type="button">清空</button>
          <button id="save-accounts-button" type="submit">添加邮箱</button>
        </footer>
      </form>
    </div>

    <div id="confirm-modal" class="modal confirm-modal" aria-hidden="true">
      <div class="modal-backdrop" data-close-confirm></div>
      <section class="confirm-panel" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
        <header>
          <div class="eyebrow">确认操作</div>
          <h2 id="confirm-title">清空本地邮箱？</h2>
        </header>
        <p id="confirm-message">这会删除本机浏览器保存的邮箱、邮件缓存和当前选择状态。此操作不会影响 Outlook 邮箱本身。</p>
        <footer>
          <button id="cancel-clear-button" class="ghost" type="button" data-close-confirm>取消</button>
          <button id="confirm-clear-button" class="danger" type="button">确认清空</button>
        </footer>
      </section>
    </div>

    <aside id="admin-entry" class="admin-entry" aria-label="管理员入口">
      <button id="admin-entry-button" class="admin-entry-button" type="button" title="管理员设置" aria-label="管理员设置" aria-expanded="false" aria-controls="admin-login-popover">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Z"></path>
          <path d="M19.4 13.4c.06-.46.06-.88 0-1.34l2-1.56-2-3.46-2.42.98a8 8 0 0 0-1.16-.66L15.46 4h-4l-.36 3.36c-.4.18-.78.4-1.16.66l-2.42-.98-2 3.46 2 1.56a7 7 0 0 0 0 1.34l-2 1.56 2 3.46 2.42-.98c.36.26.74.48 1.16.66l.36 3.36h4l.36-3.36c.4-.18.78-.4 1.16-.66l2.42.98 2-3.46-2-1.56Z"></path>
        </svg>
      </button>
      <form id="admin-login-popover" class="admin-login-popover" hidden>
        <label for="admin-entry-password">管理员密码</label>
        <div class="admin-entry-row">
          <input id="admin-entry-password" type="password" autocomplete="current-password" placeholder="输入密码" />
          <button type="submit">进入</button>
        </div>
        <p id="admin-entry-status" aria-live="polite"></p>
      </form>
    </aside>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js?v=20260603-1"></script>
  </body>
</html>
